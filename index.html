<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <title>Frontend Mentor | Interactive rating component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" aria-label="Rating card">
      <section class="rating-state" aria-live="polite">
        <div class="icon-wrap">
          <img src="images/icon-star.svg" alt="Star icon" />
        </div>

        <h1>How did we do?</h1>

        <p>
          Please let us know how we did with your support request. All feedback is appreciated
          to help us improve our offering!
        </p>

        <div class="rating" role="radiogroup" aria-label="Rating options">
          <button class="rating-btn" type="button" aria-label="Choose rating 1">1</button>
          <button class="rating-btn" type="button" aria-label="Choose rating 2">2</button>
          <button class="rating-btn" type="button" aria-label="Choose rating 3">3</button>
          <button class="rating-btn" type="button" aria-label="Choose rating 4">4</button>
          <button class="rating-btn" type="button" aria-label="Choose rating 5">5</button>
        </div>

        <button id="submit-btn" class="submit-btn" type="button" disabled>Submit</button>
      </section>

      <section class="thank-you-state hidden" aria-live="polite">
        <img class="thank-you-image" src="images/illustration-thank-you.svg" alt="Thank you illustration" />

        <p id="selection-text" class="selection-pill">You selected 0 out of 5</p>

        <h2>Thank you!</h2>

        <p class="thank-you-copy">
          We appreciate you taking the time to give a rating. If you ever need more support,
          don’t hesitate to get in touch!
        </p>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
